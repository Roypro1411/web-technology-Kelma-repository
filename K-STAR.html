<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Catch the Star Game</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #e0f2fe;
  }
  h1 { color: #0e4a5e; }
  #gameBox {
    width: 400px;
    height: 300px;
    background: white;
    border: 3px solid #0e4a5e;
    margin: 20px auto;
    position: relative;
    overflow: hidden;
  }
  #star {
    font-size: 40px;
    position: absolute;
    cursor: pointer;
    display: none;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    background: #0e4a5e;
    color: white;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>⭐ Catch the Star Game</h1>
<p>Score: <span id="score">2</span> | Time Left: <span id="time">0</span> seconds</p>

<div id="gameBox">
  <div id="star" style="left: 167px; top: 236px; display: none;">⭐</div>
</div>

<button onclick="startGame()">Start Game</button>
<p id="message">Game Over! Your final score is 2</p>

<script>
  let score = 0;
  let timeLeft = 30;
  let timer;

  let star = document.getElementById("star");
  let scoreText = document.getElementById("score");
  let timeText = document.getElementById("time");
  let message = document.getElementById("message");

  // Move star to random position
  function moveStar() {
    let x = Math.floor(Math.random() * 350);
    let y = Math.floor(Math.random() * 250);
    star.style.left = x + "px";
    star.style.top = y + "px";
    star.style.display = "block";
  }

  // When star is clicked
  star.onclick = function() {
    score++;
    scoreText.textContent = score;
    moveStar();
  };

  // Start game
  function startGame() {
    score = 0;
    timeLeft = 30;
    scoreText.textContent = score;
    timeText.textContent = timeLeft;
    message.textContent = "";
    moveStar();

    clearInterval(timer);
    timer = setInterval(function() {
      timeLeft--;
      timeText.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        star.style.display = "none";
        message.textContent = "Game Over! Your final score is " + score;
      }
    }, 1000);
  }
</script>


</body></html>
